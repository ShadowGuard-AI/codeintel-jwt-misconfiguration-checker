<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="The studio in three depths: north light changing slowly across the window, the muller circling inside the mortar while the lapis heap deepens, a hand drawing a palette knife once across a smear of bole red, and gold leaf flecks stirring on the bench edge">
<rect x="0" y="0" width="1200" height="300" fill="#f5f0e1"/>
<rect x="820" y="0" width="380" height="190" fill="#e8e6d6"><animate attributeName="fill" values="#e8e6d6;#dcd8c2;#e8e6d6" dur="40s" repeatCount="indefinite"/></rect>
<g fill="#d8d2bc"><rect x="880" y="20" width="70" height="130"/><rect x="1010" y="20" width="70" height="130"/><rect x="700" y="30" width="52" height="150"/></g>
<rect x="0" y="190" width="1200" height="110" fill="#7a5a3a"/>
<g><ellipse cx="430" cy="215" rx="150" ry="34" fill="#beb4a0"/><ellipse cx="430" cy="210" rx="128" ry="26" fill="#1b3a8c"><animate attributeName="fill" values="#1b3a8c;#142e6e;#1b3a8c" dur="12s" repeatCount="indefinite"/></ellipse>
<g><ellipse cx="478" cy="204" rx="26" ry="10" fill="#6e5a36"><animateTransform attributeName="transform" type="rotate" values="0 430 210;360 430 210" dur="12s" repeatCount="indefinite"/></ellipse></g></g>
<g><rect x="640" y="238" width="120" height="10" fill="#8c3b2e"/><g><rect x="700" y="222" width="70" height="9" fill="#3c3c3c"><animateTransform attributeName="transform" type="translate" values="0 0;-52 4;0 0" dur="14s" repeatCount="indefinite"/></rect><circle cx="706" cy="218" r="10" fill="#c49468"><animateTransform attributeName="transform" type="translate" values="0 0;-52 4;0 0" dur="14s" repeatCount="indefinite"/></circle></g></g>
<g fill="#c9a227"><circle cx="120" cy="272" r="4"><animate attributeName="cy" values="272;264;272" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;1;0.4" dur="6s" repeatCount="indefinite"/></circle><circle cx="170" cy="282" r="3"><animate attributeName="cy" values="282;276;282" dur="7s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" begin="2s" repeatCount="indefinite"/></circle><circle cx="980" cy="276" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="8s" begin="1s" repeatCount="indefinite"/></circle></g>
</svg>
